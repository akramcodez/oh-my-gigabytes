[package]
name = "omg-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
rusqlite.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true

[features]
# Off in the analysis-only build: scanning and browsing only, no permanent delete.
default = ["permanent-delete"]
permanent-delete = []

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

# Windows adapter (src/platform/windows.rs) and Windows removal in src/cleanup.rs: handle-based
# reads, owner checks and delete-by-handle.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
