[package]
name = "omg-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Distributed through npm (docs/release.md); never published to crates.io.
publish = false

[[bin]]
name = "omg"
path = "src/main.rs"

[dependencies]
omg-core = { path = "../omg-core", default-features = false }
anyhow.workspace = true
clap.workspace = true
ratatui.workspace = true
crossterm.workspace = true
serde_json.workspace = true
ctrlc.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[features]
# Analysis-only build: cargo build -p omg-cli --no-default-features
default = ["permanent-delete"]
permanent-delete = ["omg-core/permanent-delete"]

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
] }
