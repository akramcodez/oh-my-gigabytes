[package]
name = "omg-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Distributed through npm (docs/release.md); never published to crates.io.
publish = false

[[bin]]
name = "omg"
path = "src/main.rs"

[dependencies]
omg-core = { path = "../omg-core", default-features = false }
anyhow.workspace = true
clap.workspace = true
ratatui.workspace = true
crossterm.workspace = true
serde_json.workspace = true
ctrlc.workspace = true

[features]
# Analysis-only build: cargo build -p omg-cli --no-default-features
default = ["permanent-delete"]
permanent-delete = ["omg-core/permanent-delete"]

[dev-dependencies]
tempfile.workspace = true
