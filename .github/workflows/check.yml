name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  rust:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # New legs start as experimental: a failure is visible on the job but does not fail the run.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04 }
          - { os: ubuntu-24.04 }
          - { os: ubuntu-24.04-arm, experimental: true }
          - { os: windows-2022 }
          - { os: windows-latest }
          - { os: windows-11-arm, experimental: true }
          - { os: macos-26 }
          - { os: macos-15 }
          - { os: macos-15-intel }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: cargo fmt --all -- --check
      # The default build and the analysis-only build (the one that ships) are both linted and tested.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --no-default-features --locked
      - if: runner.os != 'Windows'
        run: cargo build -p omg-cli --locked && python3 -m unittest discover -s tests -p 'test_*.py' -v
      # Windows on Arm is a Rust-only leg: the launcher has no win32-arm64 target in this release.
      - if: matrix.os != 'windows-11-arm'
        run: node --test packages/oh-my-gigabytes/test/release.test.js
