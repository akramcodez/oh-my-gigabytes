name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  # macOS tests mount real disk images; a runner that cannot do so is a failure, not a skip.
  OMG_REQUIRE_DISK_IMAGES: '1'
jobs:
  rust:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # New legs start as experimental: a failure is visible on the job but does not fail the run.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04 }
          - { os: ubuntu-24.04 }
          - { os: ubuntu-24.04-arm, experimental: true }
          - { os: windows-2022 }
          - { os: windows-latest }
          - { os: windows-11-arm, experimental: true }
          - { os: macos-26 }
          - { os: macos-15 }
          - { os: macos-15-intel }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0 (the pinned commit selects the toolchain)
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # macOS temp folders live under /var, a symlink; omg refuses links in a root or state path, so
      # tests need the real location.
      - if: runner.os == 'macOS'
        run: echo "TMPDIR=$(cd "$RUNNER_TEMP" && pwd -P)" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      # The default build and the analysis-only build (the one that ships) are both linted and tested.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --no-default-features --locked
      - if: runner.os != 'Windows'
        run: cargo build -p omg-cli --locked && python3 -m unittest discover -s tests -p 'test_*.py' -v
      # Windows on Arm is a Rust-only leg: the launcher has no win32-arm64 target in this release.
      - if: matrix.os != 'windows-11-arm'
        run: node --test packages/oh-my-gigabytes/test/release.test.js
  supply-chain:
    name: licenses, advisories and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0 (the pinned commit selects the toolchain)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # The inventory must validate against the official CycloneDX 1.5 schema (pinned release).
      - name: Validate the SBOM
        run: |
          node scripts/sbom.js > "$RUNNER_TEMP/sbom.json"
          mkdir "$RUNNER_TEMP/cdx"
          for f in bom-1.5.schema.json spdx.schema.json jsf-0.82.schema.json; do
            curl -sSfL "https://raw.githubusercontent.com/CycloneDX/specification/1.7.2/schema/$f" -o "$RUNNER_TEMP/cdx/$f"
          done
          python3 -m pip install --quiet jsonschema==4.25.1
          python3 scripts/validate-sbom.py "$RUNNER_TEMP/sbom.json" "$RUNNER_TEMP/cdx"
