[[rules]]
id = "review.large-file"
name = "Large file for human review"
revision = 1
platforms = ["linux", "macos", "windows"]
tool_versions = ["not-applicable"]
category = "large_files"
tier = "review"
action = "info"
discovery = "large_file"
explanation = "This file has a large logical size. Size is not evidence that it is unwanted."
side_effects = "Removing it could lose valuable data; no deletion handler is qualified."
regeneration = "Unknown; the user must judge whether another copy or regeneration is possible."
warnings = ["Review is a judgment label, not permission to delete.", "Allocated blocks may be shared or retained by snapshots."]
preconditions = ["metadata_only"]
exclusions = ["protected", "cloud", "active_work"]
privileges = "current-user"
failure_behavior = "informational"
compatibility = "inventory-only"
deprecated = false
fixtures = ["large-positive", "large-near-miss", "protected", "incomplete"]
source = "https://doc.rust-lang.org/std/fs/struct.Metadata.html"
