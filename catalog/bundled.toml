schema_version = 1
version = 1
engine_major = 0

[[rules]]
id = "dev.npm.content-cache"
name = "npm downloaded package cache"
revision = 1
platforms = ["linux", "macos", "windows"]
tool_versions = ["unknown-inventory-only"]
category = "package_caches"
tier = "info"
action = "info"
discovery = "npm_content_cache"
explanation = "npm keeps downloaded package data here to avoid repeated downloads."
side_effects = "Removing entries can require network downloads and affect offline installs."
regeneration = "npm recreates downloaded cache entries as packages are fetched."
warnings = ["Tool version and active use are unknown; no cleanup action is qualified."]
preconditions = ["known_root", "metadata_only"]
exclusions = ["protected", "cloud", "active_work"]
privileges = "current-user"
failure_behavior = "informational"
compatibility = "inventory-only"
deprecated = false
fixtures = ["npm-positive", "npm-near-miss", "protected", "incomplete"]
source = "https://docs.npmjs.com/cli/v11/commands/npm-cache"

